<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>工程质量管理-四层结构版</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.2/dist/echarts.min.js"></script>
    <style>
        #main {
            width: 100%;
            height: 100vh;
            background: #f0f3fa;
        }
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
    </style>
</head>
<body>
    <div id="main"></div>

    <script>
        // 四层核心数据结构（修正嵌套结构）
        const qualityData = {
            name: "质量管理",
            children: [
                {
                    name: "施工监控",
                    value: 45,
                    children: [
                        { 
                            name: "地基工程", 
                            value: 15,
                            children: [
                                {name: "桩基检测", value: 6},
                                {name: "基坑支护", value: 5},
                                {name: "沉降观测", value: 4}
                            ]
                        },
                        { 
                            name: "主体结构", 
                            value: 20,
                            children: [
                                {name: "钢筋绑扎", value: 8},
                                {name: "模板工程", value: 7},
                                {name: "混凝土浇筑", value: 5}
                            ]
                        },
                        {  // 修复此处结构
                            name: "装饰装修", 
                            value: 10,
                            children: [
                                {name: "木工吊顶", value: 3},
                                {name: "瓦工铺贴", value: 3},
                                {name: "油漆涂饰", value: 4}
                            ]
                        }
                    ]  // 补充分类闭合括号
                },  // 施工监控闭合
                {
                    name: "材料检测",
                    value: 30,
                    children: [
                        { name: "钢筋检测", value: 12 },
                        { name: "混凝土试块", value: 10 },
                        { name: "防水材料", value: 8 }
                    ]
                },
                {
                    name: "人员管理",
                    value: 25,
                    children: [
                        { name: "资质审查", value: 10 },
                        { name: "安全培训", value: 10 },
                        { name: "技术交底", value: 5 }
                    ]
                },
                {
                    name: "智能技术",
                    value: 40,
                    children: [
                        { name: "BIM应用", value: 15,children: [ {name: "数据建模", value: 6}, {name: "碰撞测试", value: 5},{name: "数据反馈", value: 4} ] },
                        { name: "智能监测", value: 12 },
                        { name: "无人机巡检", value: 8 },
                        { name: "智能安全帽", value: 5 }
                    ]
                }
            ]  // children数组闭合
        };  // qualityData对象闭合

        const chart = echarts.init(document.getElementById('main'));

        // 配置项（保持四层结构）
        const option = {
            title: {
                text: '工程质量管理全景图',
                subtext: '数据基于年度质量报告',
                left: 'center',
                textStyle: {
                    color: '#2c343c',
                    fontSize: 24,
                    fontWeight: 'bold'
                }
            },
            tooltip: {
                formatter: (params) => `<strong>${params.name}</strong><br/>质量指数: ${params.value}`
            },
            series: [{
                type: 'sunburst',
                data: qualityData.children,
                radius: [20, '90%'],
                label: {
                    rotate: 'radial',
                    color: '#666',
                    fontSize: 14,
                    formatter: '{b}\n{c}'
                },
                itemStyle: {
                    borderRadius: 8,
                    borderWidth: 2,
                    borderColor: '#fff'
                },
                levels: [
                    {  // 第一层（主分类）
                        r0: '0%',
                        r: '20%',
                        itemStyle: { color: '#5470c6' }
                    },
                    {  // 第二层（子分类）
                        r0: '20%',
                        r: '45%',
                        itemStyle: { color: '#73c0de' }
                    },
                    {  // 第三层（具体项目）
                        r0: '45%',
                        r: '70%',
                        itemStyle: { color: '#91cc75' }
                    },
                    {  // 第四层（详细检测项）
                        r0: '70%',
                        r: '85%',
                        itemStyle: { color: '#fac858' }
                    }
                ],
                emphasis: {
                    itemStyle: {
                        shadowBlur: 20,
                        shadowColor: 'rgba(0, 0, 0, 0.2)'
                    }
                }
            }]
        };

        // 应用配置
        chart.setOption(option);

        // 窗口自适应
        window.addEventListener('resize', () => chart.resize());
    </script>
</body>
</html>
